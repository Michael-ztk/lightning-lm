# Hesai CR100/JT128 配置（基于 livox 配置修改）
common:
  dataset: "hesai"
  lidar_topic: "/livox/lidar"
  livox_lidar_topic: "/livox/lidar_raw"
  imu_topic: "/livox/imu"
  imu_in_g: true
  odom_topic: "/diff_chassis_driver/odom"  # 轮速里程计话题（留空则不订阅）

# fasterlio 参数
fasterlio:
  lidar_type: 5                # 1 for Livox, 2 for Velodyne, 3 for Ouster, 4 for RoboSense, 5 for Hesai
  scan_line: 32
  blind: 1.5                # 盲区，小于盲区距离的不会处理
  time_scale: 1e-3             # 兼容不同数据集的时间单位，仅对Velodyne LiDAR(lidar_type=2)生效

  skip_lidar_num: 0 # 点云的跳帧情况
  point_filter_num: 1 # 点云采样参数
  max_iteration: 6 # 最大迭代次数
  filter_size_scan: 0.3 # 对scan进行的降采样
  filter_size_map: 0.5

  ivox_grid_resolution: 0.5        # default=0.2
  ivox_nearby_type: 18             # 6, 18, 26
  esti_plane_threshold: 0.1        # default=0.1

  use_aa: true  # use anderson-acceleration

  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  extrinsic_est_en: false      # true: enable the online estimation of IMU-LiDAR extrinsic
  extrinsic_T: [ 0, 0, 0 ]
  extrinsic_R: [ 1, 0, 0,
                 0, 1, 0,
                 0, 0, 1 ]

  keep_first_imu_estimation: false
  kf_dis_th: 1.0
  kf_angle_th: 10.0

  # 射线free-space清洗：保存地图前用全部关键帧的视线证据清除动态残影（行人等）
  rayclean_en: true               # 是否开启射线清洗
  rayclean_voxel_size: 0.2        # 体素边长(m)，越小越精细但内存/计算翻倍
  rayclean_pass_th: 2             # 体素被>=该数量的不同关键帧射线穿过（且表面观测少）判为动态残影
  rayclean_end_th: 3              # 体素被<=该数量的不同关键帧观测为表面才允许判动态（静态表面会被反复观测，计数高，天然受保护）
  rayclean_plane_protect_dist: 0.3  # 平面保护：距检测平面小于该值(m)的体素不参与清洗（地面/墙面点一律保留）
  rayclean_plane_tile_size: 10.0    # 分块RANSAC的xy瓦片边长(m)
  rayclean_plane_ransac_dist: 0.15  # RANSAC平面内点距离阈值(m)
  rayclean_plane_min_inlier_frac: 0.05  # 平面最小内点比例(占瓦片点数)
  rayclean_grow_en: true              # 邻域生长：从已确认残影核心出发，吸收连通的动态边缘残余
  rayclean_grow_end_th: 12            # 生长吸收判据：邻域体素端点观测次数<=该值（静态表面观测次数远高于此，生长自然止步）
  rayclean_grow_steps: 12             # 生长最大步数(体素)
  rayclean_late_pass_th: 999          # 迟到穿越判据（实验性）：999=禁用。设为2时，"最后一次被观测为表面之后仍被>=2个
                                      # 关键帧穿越且远离平面带"的体素也会被删——可找回多拨行人反复经过同一区域
                                      # 的残留，但会对漂移弯曲的墙面/绿篱引入额外误删（0730实测 2.2k→8.7k）
  rayclean_min_cluster_points: 20 # 射线判决候选的邻域(体素+26邻域)最少候选点数，低于此数的零星候选放回；调大可进一步防墙面/天花板零星误删
  rayclean_max_range: 20.0        # 只统计该距离(m)内的点与射线
  rayclean_ray_stride: 2          # 射线采样步长，每stride个点取一条射线，控制保存阶段耗时
  rayclean_guard_dist: 0.3        # 距射线终点小于该距离(m)的体素不计穿越，保护表面贴邻体素（调大更保守）
  rayclean_iso_remove: false      # 顺带删除孤立噪点（自身体素及26邻域内无其他点，主要清天花板噪点）
  rayclean_debug_save: true       # 调试：将被清洗删除的点保存为 ray_removed_pts.pcd，用于误删检查

  # 轮速里程计融合（序贯紧耦合：雷达观测更新后单独做一次轮速位移增量观测更新）
  odom_en: true
  odom_vel_noise: 0.01        # 轮速线速度观测噪声 (m/s)^2，σ=0.1m/s
  odom_pos_noise_floor: 0.002 # 位移观测噪声下限(m)，仅数值兜底，应远小于基础噪声σ_vel·dt
  odom_pos_noise_ratio: 0.05  # 位移观测的比例噪声(无量纲)，模型化轮径标度误差/打滑
  odom_max_time_diff: 0.2     # 轮速与帧尾时间最大允许偏差(s)，超过弃用该帧轮速
  odom_yaw_offset: -1.5708    # 底盘前进方向在body系的yaw角(rad)；安装朝向 y后x左 => 前进=body -y => -π/2

g2p5:
  esti_floor: true   # 是否动态估计地面
  lidar_height: 0.0   # 雷达安装高度
  floor_height: 0.0   # 默认地面高度
  min_th_floor: 0.1  # 距离地面这个高度的障碍物被扫入栅格地图中
  max_th_floor: 1.0  # 距离地面这个高度的障碍物被扫入栅格地图中
  grid_map_resolution: 0.05 # 栅格地图分辨率
  max_miss: 30 # 每格子最大miss次数
  enable_outlier_filter: true # 是否启用离群点滤波
  min_occupied_neighbors: 2 # 离群点滤波阈值

system:
  with_loop_closing: true # 是否需要回环检测
  with_ui: false  # 是否需要3D UI
  with_2dui: false # 是否需要2D UI
  with_g2p5: true # 是否需要栅格地图
  step_on_kf: false # 是否在关键帧处暂停
  publish_map_to_rviz: true # 是否发布地图到RViz
  map_publish_interval: 2.0 # 地图发布间隔(秒)
  pub_registered_scan: false # 发布对齐后的当前帧点云

  enable_lidar_loc_skip: false
  enable_lidar_loc_rviz: false
  enable_lidar_odom_skip: false
  lidar_loc_skip_num: 4
  lidar_odom_skip_num: 0
  map_path: ./data/new_map/
  pub_tf: true

loop_closing:
  loop_kf_gap: 5       # 每隔多少个关键帧检查一次
  min_id_interval: 10   # 被检查的关键帧ID间隔
  closest_id_th: 100     # 历史关键帧与当前帧的ID间隔
  max_range: 2.0       # 候选帧的最大距离
  ndt_score_th: 1.3     # ndt位姿分值
  source_submap_idx_range: 5
  source_submap_stride: 1
  with_height: false
  save_loop_clouds: true  # 保存回环点云用于调试


### localization ================================================================================================
lidar_loc:
  enable_dynamic_polygon: false
  enable_parking_static: true
  enable_icp_adjust: false
  filter_intensity_max: 100.0
  filter_intensity_min: 10.0
  filter_z_max: 30.0
  filter_z_min: -1.0
  force_2d: false
  grid_search_angle_range: 30.0
  grid_search_angle_step: 5
  grid_search_xy_range: 2.0
  grid_search_xy_step: 1.0
  lidar_loc_odom_th: 0.5
  init_with_fp: false
  init_pose_enable: false
  init_pose_trans: [0.0, -0.0, 0.0]
  init_pose_yaw: 0.0
  min_init_confidence: 1.8
  update_dynamic_cloud: false
  update_err_h: 0.2
  update_err_v: 0.2
  update_kf_dis: 2.0
  update_lidar_loc_score: 2.5
  loc_on_kf: true
  try_self_extrap: false
maps:
  delete_when_unload: false
  dyn_cloud_policy: persistent
  load_dyn_cloud: true
  load_map_size: 2
  max_pts_dyn_chunk: 100000
  save_dyn_when_quit: true
  save_dyn_when_unload: false
  unload_map_size: 4
  with_dyn_area: false
pgo:
  dr_ang_noise: 0.5
  dr_pos_noise: 1.0
  dr_pos_noise_ratio: 1.0
  lidar_loc_ang_noise: 1.0
  lidar_loc_outlier_th: 5.0
  lidar_loc_pos_noise: 0.3
  lidar_odom_ang_noise: 1.0
  lidar_odom_pos_noise: 0.3
  pgo_frame_converge_ang_th: 1.0
  pgo_frame_converge_pos_th: 0.05
  rtk_fix_ang_noise: 2.0
  rtk_fix_pos_noise: 1.0
  rtk_height_noise_ratio: 10.0
  rtk_other_ang_noise: 10.0
  rtk_other_pos_noise: 5.0
  rtk_outlier_th: 1.0
  smooth_factor: 0.01
roi:
  height_max: 0.5
  height_min: -2.0
  range_max: 70
  range_min: 3.0
ui:
  car_length: 2.0
  car_width: 1.6
  car_height: 1.7
  scans: 1